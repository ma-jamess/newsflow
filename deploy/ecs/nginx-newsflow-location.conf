# Include inside the existing port-80 server block.
location = /newsflow {
    return 308 /newsflow/;
}

location ^~ /newsflow/ {
    alias /var/lib/newsflow/site/;
    index index.html;
    autoindex off;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
