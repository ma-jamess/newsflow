# Install as a separate enabled Nginx site after issuing the IP certificate.
# Keep the existing HTTP server and its ACME challenge location.
server {
    listen 443 ssl;
    server_name 47.115.130.110;

    ssl_certificate /etc/newsflow-acme/live/newsflow-ip/fullchain.pem;
    ssl_certificate_key /etc/newsflow-acme/live/newsflow-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NewsFlowSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/snippets/newsflow.conf;

    location = / {
        return 308 /newsflow/;
    }

    location / {
        return 404;
    }
}
